<rect x="40" y="110" width="250" height="70" rx="7" fill="#FFF8DB" stroke="#B8860B" stroke-width="2"/>
<text x="165.0" y="134.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1F1F2E">1. Recibir</text>
<text x="165.0" y="149.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#1F1F2E">Wazuh ≥10 (correo/tablero) ·</text>
<text x="165.0" y="164.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#1F1F2E">Kaspersky · NGFW · buzón phishing</text>
<rect x="340" y="110" width="250" height="70" rx="7" fill="#E7F0FB" stroke="#1F5FAD" stroke-width="2"/>
<text x="465.0" y="134.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1F1F2E">2. Registrar</text>
<text x="465.0" y="149.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#1F1F2E">ticket GLPI con plantilla</text>
<text x="465.0" y="164.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#1F1F2E">“Alerta de seguridad”</text>
<rect x="640" y="110" width="250" height="70" rx="7" fill="#E7F0FB" stroke="#1F5FAD" stroke-width="2"/>
<text x="765.0" y="134.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1F1F2E">3. Enriquecer</text>
<text x="765.0" y="149.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#1F1F2E">inventario GLPI · historial</text>
<text x="765.0" y="164.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#1F1F2E">Wazuh · reputación IP/URL/hash</text>
<rect x="940" y="110" width="250" height="70" rx="7" fill="#F3EEFA" stroke="#6B46A8" stroke-width="2"/>
<text x="1065.0" y="134.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1F1F2E">4. Clasificar</text>
<text x="1065.0" y="149.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#1F1F2E">falso positivo / benigno /</text>
<text x="1065.0" y="164.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#1F1F2E">verdadero positivo</text>
<rect x="1260" y="110" width="400" height="70" rx="7" fill="#F1F1F1" stroke="#777777" stroke-width="2"/>
<text x="1460.0" y="134.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1F1F2E">Falso positivo o benigno</text>
<text x="1460.0" y="149.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#1F1F2E">cerrar con solución + proponer ajuste</text>
<text x="1460.0" y="164.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#1F1F2E">de regla (ticket de Cambio)</text>
<rect x="940" y="250" width="250" height="80" rx="7" fill="#FDEBD3" stroke="#E8590C" stroke-width="2"/>
<text x="1065.0" y="279.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1F1F2E">5. Asignar severidad</text>
<text x="1065.0" y="294.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#1F1F2E">Crítica 15 min · Alta 30 min</text>
<text x="1065.0" y="309.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#1F1F2E">Media 2 h · Baja 8 h</text>
<rect x="640" y="250" width="250" height="80" rx="7" fill="#1F1F2E" stroke="#1F1F2E" stroke-width="2"/>
<text x="765.0" y="279.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#FFFFFF">6. Ejecutar playbook</text>
<text x="765.0" y="294.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#FFFFFF">PB-01 … PB-09</text>
<text x="765.0" y="309.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#FFFFFF">(solo acciones permitidas al N1)</text>
<rect x="340" y="250" width="250" height="80" rx="7" fill="#FCE8EC" stroke="#A61E4D" stroke-width="2"/>
<text x="465.0" y="279.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1F1F2E">¿Requiere escalar?</text>
<text x="465.0" y="294.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#1F1F2E">compromiso confirmado, activo</text>
<text x="465.0" y="309.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#1F1F2E">crítico, Alta/Crítica, varios equipos</text>
<rect x="40" y="250" width="250" height="80" rx="7" fill="#EAF6EC" stroke="#2F7D3A" stroke-width="2"/>
<text x="165.0" y="279.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1F1F2E">7a. Cerrar</text>
<text x="165.0" y="294.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#1F1F2E">solución documentada</text>
<text x="165.0" y="309.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#1F1F2E">en GLPI</text>
<rect x="340" y="400" width="250" height="80" rx="7" fill="#FCE8EC" stroke="#A61E4D" stroke-width="2"/>
<text x="465.0" y="429.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1F1F2E">7b. Escalar a N2</text>
<text x="465.0" y="444.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#1F1F2E">plantilla · grupo SOC N2 ·</text>
<text x="465.0" y="459.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#1F1F2E">llamada si Alta/Crítica</text>
<rect x="640" y="400" width="250" height="80" rx="7" fill="#FCE8EC" stroke="#A61E4D" stroke-width="2"/>
<text x="765.0" y="429.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1F1F2E">N2 investiga y decide</text>
<text x="765.0" y="444.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#1F1F2E">contención mayor,</text>
<text x="765.0" y="459.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#1F1F2E">restauración, notificación</text>
<rect x="940" y="400" width="250" height="80" rx="7" fill="#FDEBD3" stroke="#E8590C" stroke-width="2"/>
<text x="1065.0" y="429.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1F1F2E">Informe de incidente</text>
<text x="1065.0" y="444.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#1F1F2E">(Anexo D) · aviso a gerencia;</text>
<text x="1065.0" y="459.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#1F1F2E">Ley 1581 si hay datos personales</text>
<rect x="1260" y="400" width="400" height="80" rx="7" fill="#EAF6EC" stroke="#2F7D3A" stroke-width="2"/>
<text x="1460.0" y="429.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1F1F2E">8. Aprender</text>
<text x="1460.0" y="444.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#1F1F2E">lección aprendida · ajuste de reglas y</text>
<text x="1460.0" y="459.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#1F1F2E">políticas · KPIs (MTTA, MTTR, FP)</text>
<rect x="60" y="620" width="760" height="40" rx="7" fill="#EAF6EC" stroke="#2F7D3A" stroke-width="2"/>
<text x="440.0" y="644.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1F1F2E">Cuarentena de archivo desde Kaspersky</text>
<rect x="60" y="668" width="760" height="40" rx="7" fill="#EAF6EC" stroke="#2F7D3A" stroke-width="2"/>
<text x="440.0" y="692.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1F1F2E">Aislar equipo (Alta/Crítica) y avisar a N2</text>
<rect x="60" y="716" width="760" height="40" rx="7" fill="#EAF6EC" stroke="#2F7D3A" stroke-width="2"/>
<text x="440.0" y="740.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1F1F2E">Bloqueo temporal de IP/dominio en el NGFW</text>
<rect x="60" y="764" width="760" height="40" rx="7" fill="#EAF6EC" stroke="#2F7D3A" stroke-width="2"/>
<text x="440.0" y="788.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1F1F2E">Cierre de sesiones y cambio de clave (cuenta no privilegiada)</text>
<rect x="60" y="812" width="760" height="40" rx="7" fill="#EAF6EC" stroke="#2F7D3A" stroke-width="2"/>
<text x="440.0" y="836.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1F1F2E">Pedir al usuario no tocar el equipo · desmontar unidad de red</text>
<rect x="880" y="620" width="760" height="40" rx="7" fill="#FCE8EC" stroke="#A61E4D" stroke-width="2"/>
<text x="1260.0" y="644.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1F1F2E">Borrar o alterar evidencias</text>
<rect x="880" y="668" width="760" height="40" rx="7" fill="#FCE8EC" stroke="#A61E4D" stroke-width="2"/>
<text x="1260.0" y="692.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1F1F2E">Apagar el NAS o el servidor · restaurar · reinstalar</text>
<rect x="880" y="716" width="760" height="40" rx="7" fill="#FCE8EC" stroke="#A61E4D" stroke-width="2"/>
<text x="1260.0" y="740.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1F1F2E">Eliminar o modificar cuentas privilegiadas</text>
<rect x="880" y="764" width="760" height="40" rx="7" fill="#FCE8EC" stroke="#A61E4D" stroke-width="2"/>
<text x="1260.0" y="788.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1F1F2E">Cambiar políticas, exclusiones o reglas sin ticket</text>
<rect x="880" y="812" width="760" height="40" rx="7" fill="#FCE8EC" stroke="#A61E4D" stroke-width="2"/>
<text x="1260.0" y="836.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1F1F2E">Forense, ingeniería inversa o acciones ofensivas</text>
