<!-- /var/ossec/etc/shared/windows-servidores/agent.conf — SRV-C04-FS01 (Windows Server 2019) -->
<agent_config os="Windows">
  <syscheck>
    <frequency>3600</frequency>
    <directories check_all="yes" realtime="yes">D:\Compartido</directories>
    <directories check_all="yes" report_changes="yes">C:\Windows\System32\drivers\etc</directories>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services</windows_registry>
  </syscheck>
  <sca>
    <enabled>yes</enabled>
    <interval>12h</interval>
  </sca>
</agent_config>
