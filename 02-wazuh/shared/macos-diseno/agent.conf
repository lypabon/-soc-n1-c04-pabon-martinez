<!-- /var/ossec/etc/shared/macos-diseno/agent.conf — 8 Mac de diseño (no virtualizados en el laboratorio)
     El FIM en tiempo real depende del soporte de la plataforma: verificar en la documentación oficial.
     Se deja programado cada hora. -->
<agent_config os="Darwin">
  <syscheck>
    <frequency>3600</frequency>
    <directories check_all="yes">/Users/Shared/Proyectos</directories>
    <!-- Persistencia típica de malware en macOS -->
    <directories check_all="yes">/Library/LaunchAgents,/Library/LaunchDaemons</directories>
    <directories check_all="yes">/etc</directories>
    <ignore type="sregex">\.DS_Store$|/\._</ignore>
  </syscheck>
  <sca>
    <enabled>yes</enabled>
    <interval>12h</interval>
  </sca>
</agent_config>
