<!-- /var/ossec/etc/shared/linux-nas/agent.conf — NAS de proyectos (nas-c04-lp en laboratorio) -->
<agent_config os="Linux">
  <syscheck>
    <frequency>3600</frequency>
    <!-- Proyectos de clientes: tiempo real, sin report_changes (archivos binarios grandes) -->
    <directories check_all="yes" realtime="yes">/srv/proyectos</directories>
    <!-- Configuración sensible: con diferencias de contenido -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc/samba,/etc/ssh,/etc/sudoers.d</directories>
    <directories check_all="yes">/etc,/usr/bin,/usr/sbin</directories>
    <ignore>/etc/mtab</ignore>
    <ignore type="sregex">\.tmp$|~$|\.DS_Store$|/\._|Thumbs\.db$</ignore>
  </syscheck>

  <!-- Auditoría de Samba (ver 02-wazuh/nas/) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/samba/audit.log</location>
  </localfile>

  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
  </sca>
</agent_config>
