# Fragmento de /etc/samba/smb.conf en nas-c04-lp
# Registra quién (usuario, IP, equipo) abre, renombra, borra o escribe en el recurso "proyectos".

[proyectos]
   path = /srv/proyectos
   browseable = yes
   read only = no
   valid users = @proyectos
   vfs objects = full_audit
   full_audit:prefix = %u|%I|%m|%S
   full_audit:success = renameat unlinkat mkdirat
   # (openat y pwrite se omiten: generan demasiado volumen en archivos de diseño)
   full_audit:failure = none
   full_audit:facility = local5
   full_audit:priority = notice
